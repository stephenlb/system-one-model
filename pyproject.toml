[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truetype-replica"
version = "0.1.0"
description = "Lightweight client and self-hosted API for Gemma 4 typed decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/stephenlb/truetype.ai-open"

[project.optional-dependencies]
server = [
    "torch",
    "transformers>=5.17.0",
    "fastapi",
    "uvicorn",
    "pydantic",
    "accelerate",
    "pillow",
]
test = ["pytest", "httpx"]

[project.scripts]
truetype-api = "truetype.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
